[project]
name = "audio-tag-retrieval"
version = "0.1.0"
description = "Audio tagging and tag-based audio retrieval on MagnaTagATune."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "faiss-cpu>=1.7.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "tensorboard>=2.14",
    "torchcodec==0.16.0",
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audiotag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_data: tests that need the real MagnaTagATune dataset (deselected in CI)",
]

[tool.coverage.run]
source = ["audiotag"]
omit = ["audiotag/data/download.py"]

[tool.coverage.report]
fail_under = 75
exclude_lines = [
    "if __name__ == .__main__.:",
    "raise SystemExit",
    "pragma: no cover",
]
