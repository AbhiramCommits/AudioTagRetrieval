[project]
name = "audio-tag-retrieval"
version = "0.1.0"
description = "Audio tagging and tag-based audio retrieval on MagnaTagATune."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "faiss-cpu>=1.7.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audiotag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
